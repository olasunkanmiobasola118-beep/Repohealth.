<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RepoHealth{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />

    <!-- Our own styles (loaded last so they can override Bootstrap) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- Lets keyboard users jump past the navbar -->
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to main content</a
    >

    <header>
      <nav
        class="navbar navbar-expand-md rh-navbar"
        aria-label="Main navigation"
      >
        <div class="container">
          <a
            class="navbar-brand fw-bold rh-brand"
            href="{{ url_for('index') }}"
            aria-label="RepoHealth home"
          >
            <span class="rh-brand-mark"
              ><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i
            ></span>
            <span>repo<span class="rh-brand-accent">health</span></span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
            aria-controls="navMenu"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#scan">Analyze</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#checks">What we check</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#about">About</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main id="main">{% block content %}{% endblock %}</main>

    <footer class="rh-footer py-4 mt-5">
      <div class="container text-center text-secondary small">
        Built for clearer first looks at public projects. Reports are a starting
        point for review—not a guarantee of quality or security.
      </div>
    </footer>

    <!-- Bootstrap JS (needed for the mobile menu button) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
